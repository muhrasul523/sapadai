<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penyesuaian Penempatan Da'i | SAPADAI</title>
    
    <link rel="icon" type="image/png" href="../logo_sapadai_1.png">
    <meta property="og:image" content="../logo_sapadai_2.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-emerald: #064e3b;
            --neon-green: #10b981;
            --neon-gold: #fbbf24;
            --neon-red: #ef4444;
            --text-main: #ffffff;
            --text-muted: #e2e8f0;
            --glass-bg: rgba(0, 0, 0, 0.6);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-emerald) 100%);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }

        .header-logo { text-align: center; margin-bottom: 30px; }
        .header-logo img {
            max-height: 80px;
            filter: drop-shadow(0 0 10px rgba(16,185,129,0.8));
            cursor: pointer;
            transition: transform 0.3s;
        }
        .header-logo img:hover { transform: scale(1.05); }

        h2, h3 { color: var(--neon-gold); margin-bottom: 20px; text-align: center; font-weight: 600; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; color: var(--text-main); margin-bottom: 8px; font-weight: 500; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);}
        
        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .input-field::placeholder { color: #94a3b8; }
        .input-field:focus { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(16, 185, 129, 0.6); }
        .input-field[readonly] { background: rgba(255, 255, 255, 0.1); color: #a7f3d0; cursor: not-allowed; border-color: transparent; }
        select.input-field option { background: var(--bg-dark); color: #fff; }

        .btn {
            width: 100%;
            padding: 15px;
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 15px rgba(16, 185, 129, 0.8); }
        .btn-gold { border-color: var(--neon-gold); color: var(--neon-gold); }
        .btn-gold:hover { background: var(--neon-gold); box-shadow: 0 0 15px rgba(251, 191, 36, 0.8); }
        .btn-red { border-color: var(--neon-red); color: var(--neon-red); }
        .btn-red:hover { background: var(--neon-red); box-shadow: 0 0 15px rgba(239, 68, 68, 0.8); }

        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Admin Table */
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; background: rgba(0,0,0,0.3); border-radius: 8px;}
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--glass-border); color: #fff; font-size: 13px;}
        th { color: var(--neon-gold); font-weight: 600; background: rgba(0,0,0,0.5); }
        
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .status-pending { background: rgba(251, 191, 36, 0.2); color: var(--neon-gold); border: 1px solid var(--neon-gold); }
        .status-accepted { background: rgba(16, 185, 129, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .status-rejected { background: rgba(239, 68, 68, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }

        .action-btns { display: flex; gap: 5px; flex-wrap: wrap; }
        .action-btns button { padding: 5px 10px; font-size: 11px; border-radius: 5px; cursor: pointer; border: none; font-weight: 600;}
        .btn-copy { background: #3b82f6; color: white; }
        .btn-acc { background: var(--neon-green); color: black; }
        .btn-rej { background: var(--neon-red); color: white; }

        .loader-overlay, .alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; color: #fff;
            backdrop-filter: blur(5px);
        }
        .alert-overlay { display: none; z-index: 10000; }
        .alert-box {
            background: var(--bg-dark); border: 2px solid var(--neon-gold);
            padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }
        
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(16,185,129,0.2);
            border-top-color: var(--neon-green); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        
        .file-list { font-size: 12px; color: var(--neon-gold); margin-top: 5px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 5px;}

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <h3 id="loaderText" style="color: var(--neon-green);">Menghubungkan ke SAPADAI...</h3>
    </div>

    <!-- Custom Alert -->
    <div class="alert-overlay" id="customAlert">
        <div class="alert-box">
            <h3 id="alertTitle" style="color: var(--neon-gold); margin-bottom: 10px;">Pemberitahuan</h3>
            <p id="alertMessage" style="font-size: 14px; margin-bottom: 20px; color: #fff;"></p>
            <button class="btn btn-gold" onclick="closeAlert()" style="padding: 10px;">TUTUP</button>
        </div>
    </div>

    <div class="container">
        <!-- ================= LOGIN VIEW ================= -->
        <div class="glass-panel view-section" id="loginView">
            <div class="header-logo">
                <img src="../logo_sapadai_1.png" alt="Logo SAPADAI" class="admin-logo-btn" title="Akses Admin" onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgODAiPjxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iODAiIGZpbGw9IiMwNjRlM2IiIHJ4PSIxMCIvPjxjaXJjbGUgY3g9IjEwMCIgY3k9IjQwIiByPSIyMCIgZmlsbD0iIzEwYjk4MSIvPjwvc3ZnPg==';">
            </div>
            <h2>Portal Penempatan Da'i</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email atau Nomor WA</label>
                    <input type="text" id="loginId" class="input-field" placeholder="0812xxxx atau email@domain.com" required>
                </div>
                <div class="form-group">
                    <label>Kata Sandi</label>
                    <input type="password" id="loginPass" class="input-field" placeholder="Masukkan kata sandi" required>
                </div>
                <button type="submit" class="btn">MASUK</button>
            </form>
        </div>

        <!-- ================= DA'I DASHBOARD VIEW ================= -->
        <div class="glass-panel view-section" id="daiView">
            <div class="header-logo">
                <img src="../logo_sapadai_1.png" alt="Logo SAPADAI" class="admin-logo-btn" title="Akses Admin" onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgODAiPjxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iODAiIGZpbGw9IiMwNjRlM2IiIHJ4PSIxMCIvPjxjaXJjbGUgY3g9IjEwMCIgY3k9IjQwIiByPSIyMCIgZmlsbD0iIzEwYjk4MSIvPjwvc3ZnPg==';">
            </div>
            <h3>Profil Penempatan Saat Ini</h3>
            
            <div class="form-group">
                <label>Nama Lengkap & Gelar</label>
                <input type="text" id="profNama" class="input-field" readonly>
            </div>
            <div class="form-group" style="display:flex; gap:10px; flex-wrap: wrap;">
                <div style="flex:1; min-width: 150px;">
                    <label>Tahun Diutus</label>
                    <input type="text" id="profTahun" class="input-field" readonly>
                </div>
                <div style="flex:1; min-width: 150px;">
                    <label>SK Penempatan</label>
                    <input type="text" id="profSK" class="input-field" readonly>
                </div>
            </div>
            <div class="form-group">
                <label>Lokasi Penempatan Awal</label>
                <input type="text" id="profLokasi" class="input-field" readonly>
            </div>

            <hr style="border: 1px solid var(--glass-border); margin: 30px 0;">

            <h3>Apakah penempatan sekarang sudah sesuai?</h3>
            <div class="form-group" style="display: flex; gap: 20px; justify-content: center; margin-top: 15px;">
                <label style="font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <input type="radio" name="isSesuai" value="ya" style="width: 20px; height: 20px;">
                    <span style="color: var(--neon-green); font-weight: 600;">Sudah Sesuai</span>
                </label>
                <label style="font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <input type="radio" name="isSesuai" value="tidak" style="width: 20px; height: 20px;">
                    <span style="color: var(--neon-red); font-weight: 600;">Tidak Sesuai (Pindah)</span>
                </label>
            </div>

            <!-- Formulir Pemindahan -->
            <form id="pindahForm" style="display: none; margin-top: 30px; background: rgba(0,0,0,0.4); padding: 25px; border-radius: 15px; border: 1px solid var(--glass-border);">
                <h3 style="color: var(--neon-gold); font-size: 18px; margin-bottom: 25px;">Form Usulan Penyesuaian</h3>
                
                <div class="form-group">
                    <label>Unit Baru</label>
                    <select id="formUnit" class="input-field" required onchange="handleUnitChange()">
                        <option value="">-- Pilih Unit --</option>
                        <option value="DPW">DPW (Tingkat Wilayah/Provinsi)</option>
                        <option value="DPD">DPD (Tingkat Daerah/Kabupaten)</option>
                        <option value="DPC">DPC (Tingkat Cabang/Kecamatan)</option>
                        <option value="Sekolah">Sekolah / Yayasan</option>
                        <option value="Masjid">Masjid</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                
                <!-- Datalist Wilayah (Hidden) -->
                <datalist id="listProv"></datalist>
                <datalist id="listKab"></datalist>

                <!-- Input Autosearch Wilayah -->
                <div class="form-group" id="wrapProv" style="display: none;">
                    <label>Pilih Provinsi Penempatan Baru</label>
                    <input type="text" id="formProv" class="input-field" list="listProv" placeholder="Ketik nama provinsi..." autocomplete="off">
                    <input type="hidden" id="hiddenProvId">
                </div>

                <div class="form-group" id="wrapKab" style="display: none;">
                    <label>Pilih Kabupaten/Kota Penempatan Baru</label>
                    <input type="text" id="formKab" class="input-field" list="listKab" placeholder="Ketik nama kabupaten/kota..." autocomplete="off" oninput="handleKabChange()">
                    <input type="hidden" id="hiddenKabId">
                </div>

                <div class="form-group" id="wrapInstansi" style="display: none;">
                    <label>Nama Instansi / Sekolah / Masjid / Unit</label>
                    <input type="text" id="formInstansi" class="input-field" placeholder="Masukkan nama instansi spesifik">
                </div>

                <div class="form-group">
                    <label>Tanggal Pemindahan</label>
                    <input type="date" id="formTanggal" class="input-field" required>
                </div>

                <div class="form-group">
                    <label>Siapa yang memindahkan?</label>
                    <select id="formPemindah" class="input-field" required>
                        <option value="">-- Pilih Pihak --</option>
                        <option value="Pengurus Pusat">Pengurus Pusat</option>
                        <option value="Pengurus Wilayah (DPW)">Pengurus Wilayah (DPW)</option>
                        <option value="Pengurus Daerah (DPD)">Pengurus Daerah (DPD)</option>
                        <option value="Inisiatif Sendiri (Mandiri)">Inisiatif Sendiri</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Alasan Pemindahan</label>
                    <textarea id="formAlasan" class="input-field" rows="3" placeholder="Jelaskan alasan pemindahan..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Bukti Pemindahan (Maks. 5 Foto JPG/PNG)</label>
                    <input type="file" id="formFile" class="input-field" accept="image/png, image/jpeg" multiple>
                    <div id="fileList" class="file-list" style="display: none;"></div>
                </div>

                <button type="submit" class="btn btn-gold">AJUKAN PENYESUAIAN</button>
            </form>
            
            <button onclick="logout()" class="btn btn-red" style="margin-top:30px;">KELUAR AKUN</button>
        </div>

        <!-- ================= ADMIN DASHBOARD VIEW ================= -->
        <div class="glass-panel view-section" id="adminView" style="max-width: 1000px;">
            <div class="header-logo">
                <h2>Panel Admin Rekap Penempatan</h2>
            </div>
            
            <div class="table-responsive">
                <table id="adminTable">
                    <thead>
                        <tr>
                            <th>Nama Da'i</th>
                            <th>No. WA</th>
                            <th>Penempatan Awal</th>
                            <th>Usulan Baru (Wilayah & Unit)</th>
                            <th>Alasan</th>
                            <th>Bukti</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Data render via JS -->
                    </tbody>
                </table>
            </div>
            
            <button onclick="logout()" class="btn btn-red" style="margin-top:30px; max-width: 200px;">KELUAR ADMIN</button>
        </div>

    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzEuLSgLOPljMpc0QyQ415MEXD7E1fSjYrV1UY2qdRSgarTjkS5qjx5B7HvNSikOj94/exec';
        
        let dbData = null;
        let currentUser = null;
        let uploadedFilesBase64 = []; 
        let rawWilayahData = { prov: [], kabkota: [] };

        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');

        // Custom Alert System
        function showCustomAlert(msg, title = "Pemberitahuan") {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = msg;
            document.getElementById('customAlert').style.display = 'flex';
        }
        function closeAlert() {
            document.getElementById('customAlert').style.display = 'none';
        }

        // Format Nomor WA (Realtime 08 -> 62)
        document.getElementById('loginId').addEventListener('input', function(e) {
            let val = e.target.value;
            if (/^[0-9]+$/.test(val) && val.startsWith('08')) {
                e.target.value = '62' + val.substring(1);
            }
        });

        // Initialize App
        async function initApp() {
            if (window.location.hostname === '' || window.location.hostname === 'null') {
                console.log("Berjalan di Mode Simulasi (Local/Canvas)");
                generateDummyData();
                setupWilayahDatalist();
                hideLoader();
                showView('loginView');
                return;
            }

            try {
                const response = await fetch(API_URL + '?action=getData');
                const result = await response.json();
                
                if(result.status === 'success') {
                    dbData = result.data;
                    if(dbData.wilayah) rawWilayahData = dbData.wilayah;
                    setupWilayahDatalist();
                    hideLoader();
                    showView('loginView');
                } else {
                    showCustomAlert("Gagal memuat data database: " + result.message, "Error DB");
                }
            } catch (error) {
                console.error("Fetch Error, Menggunakan Data Dummy:", error);
                generateDummyData(); 
                setupWilayahDatalist();
                hideLoader();
                showView('loginView');
            }
        }

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const idInput = document.getElementById('loginId').value.trim();
            const passInput = document.getElementById('loginPass').value;

            const user = dbData.akun.find(u => 
                (u.wa == idInput || u.email == idInput) && u.password == passInput
            );

            if (user) {
                currentUser = user;
                if(user.role && user.role.toLowerCase() === 'admin') {
                    renderAdminTable();
                    showView('adminView');
                } else {
                    renderDaiProfile();
                    showView('daiView');
                }
            } else {
                showCustomAlert("Email/WA atau Kata Sandi salah!", "Login Gagal");
            }
        });

        // Render Da'i Data
        function renderDaiProfile() {
            let userProfile = dbData.profil.find(p => p.nama_lengkap_beserta_gelar == currentUser.nama) || {};
            let userPenempatan = dbData.penempatan.find(p => p.nama_lengkap_beserta_gelar == currentUser.nama) || {};

            document.getElementById('profNama').value = currentUser.nama || "-";
            document.getElementById('profTahun').value = userPenempatan.tahun_diutus || userProfile.tahun_diutus || "-";
            document.getElementById('profSK').value = userPenempatan.SK_Penempatan || "-";
            document.getElementById('profLokasi').value = userPenempatan.lokasi_awal || "Belum ada data";
        }

        // Radio Sesuai / Tidak Sesuai
        const radios = document.getElementsByName('isSesuai');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                const formArea = document.getElementById('pindahForm');
                if (e.target.value === 'tidak') {
                    formArea.style.display = 'block';
                    formArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    formArea.style.display = 'none';
                }
            });
        });

        // Setup Wilayah Datalist (Dari fetch Spreadsheet Eksternal)
        function setupWilayahDatalist() {
            const listProv = document.getElementById('listProv');
            const listKab = document.getElementById('listKab');
            
            listProv.innerHTML = '';
            rawWilayahData.prov.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p.name;
                opt.setAttribute('data-id', p.id);
                listProv.appendChild(opt);
            });

            listKab.innerHTML = '';
            rawWilayahData.kabkota.forEach(k => {
                let opt = document.createElement('option');
                opt.value = k.name;
                opt.setAttribute('data-id', k.id);
                opt.setAttribute('data-prov-id', k.prov_id);
                listKab.appendChild(opt);
            });
        }

        // Handler saat Unit Berubah
        function handleUnitChange() {
            const unit = document.getElementById('formUnit').value;
            const wProv = document.getElementById('wrapProv');
            const wKab = document.getElementById('wrapKab');
            const wInst = document.getElementById('wrapInstansi');
            
            const iProv = document.getElementById('formProv');
            const iKab = document.getElementById('formKab');
            const iInst = document.getElementById('formInstansi');

            // Reset field
            iProv.value = ''; document.getElementById('hiddenProvId').value = '';
            iKab.value = ''; document.getElementById('hiddenKabId').value = '';
            iInst.value = '';
            iProv.readOnly = false;

            if (unit === 'DPW') {
                wProv.style.display = 'block'; iProv.required = true;
                wKab.style.display = 'none'; iKab.required = false;
                wInst.style.display = 'none'; iInst.required = false;
            } else if (unit === '') {
                wProv.style.display = 'none'; iProv.required = false;
                wKab.style.display = 'none'; iKab.required = false;
                wInst.style.display = 'none'; iInst.required = false;
            } else {
                wKab.style.display = 'block'; iKab.required = true;
                wProv.style.display = 'block'; iProv.required = true; iProv.readOnly = true; // Auto fill dari Kab
                
                if (unit === 'DPD') {
                    wInst.style.display = 'none'; iInst.required = false;
                } else {
                    wInst.style.display = 'block'; iInst.required = true;
                }
            }
        }

        // Handler Autofill Provinsi ketika Kabupaten Dipilih di Datalist
        function handleKabChange() {
            const inputKab = document.getElementById('formKab');
            const val = inputKab.value;
            const options = document.getElementById('listKab').options;
            
            for (let i = 0; i < options.length; i++) {
                if (options[i].value === val) {
                    // Ketemu!
                    const idKab = options[i].getAttribute('data-id');
                    const idProv = options[i].getAttribute('data-prov-id');
                    document.getElementById('hiddenKabId').value = idKab;
                    
                    // Cari nama provinsi berdasarkan idProv
                    const provObj = rawWilayahData.prov.find(p => p.id == idProv);
                    if (provObj) {
                        document.getElementById('formProv').value = provObj.name;
                        document.getElementById('hiddenProvId').value = provObj.id;
                    }
                    return;
                }
            }
            // Jika diketik manual tapi tidak ada di list
            document.getElementById('hiddenKabId').value = '';
            document.getElementById('formProv').value = '';
            document.getElementById('hiddenProvId').value = '';
        }

        // Tangkap event untuk Datalist Provinsi (Jika Unit DPW)
        document.getElementById('formProv').addEventListener('input', function(e) {
            if(document.getElementById('formUnit').value !== 'DPW') return; // Hanya berlalu jika ngisi manual
            const val = e.target.value;
            const options = document.getElementById('listProv').options;
            for (let i = 0; i < options.length; i++) {
                if (options[i].value === val) {
                    document.getElementById('hiddenProvId').value = options[i].getAttribute('data-id');
                    return;
                }
            }
            document.getElementById('hiddenProvId').value = '';
        });


        // File Upload Handler Base64
        document.getElementById('formFile').addEventListener('change', function(e) {
            const files = e.target.files;
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            uploadedFilesBase64 = [];

            if(files.length > 5) {
                showCustomAlert("Maksimal 5 foto!", "Peringatan");
                this.value = '';
                fileList.style.display = 'none';
                return;
            }

            if(files.length > 0) fileList.style.display = 'block';

            Array.from(files).forEach((file) => {
                fileList.innerHTML += `📄 ${file.name}<br>`;
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedFilesBase64.push(event.target.result);
                };
                reader.readAsDataURL(file);
            });
        });

        // Submit Usulan Pindah
        document.getElementById('pindahForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validasi Datalist agar tidak asal ketik
            const unit = document.getElementById('formUnit').value;
            if (unit === 'DPW' && !document.getElementById('hiddenProvId').value) {
                showCustomAlert("Silakan pilih Provinsi dari daftar yang tersedia.", "Validasi"); return;
            }
            if (unit !== 'DPW' && !document.getElementById('hiddenKabId').value) {
                showCustomAlert("Silakan pilih Kabupaten/Kota dari daftar yang tersedia.", "Validasi"); return;
            }

            showLoader("Menyimpan Usulan...");

            const payload = {
                nama: currentUser.nama,
                wa: currentUser.wa,
                tahun_diutus: document.getElementById('profTahun').value,
                sk_awal: document.getElementById('profSK').value,
                lokasi_awal: document.getElementById('profLokasi').value,
                
                unit_baru: unit,
                id_prov: document.getElementById('hiddenProvId').value,
                nama_prov: document.getElementById('formProv').value,
                id_kab: document.getElementById('hiddenKabId').value || '-',
                nama_kab: document.getElementById('formKab').value || '-',
                instansi_baru: document.getElementById('formInstansi').value || '-',
                
                tanggal_pindah: document.getElementById('formTanggal').value,
                dipindahkan_oleh: document.getElementById('formPemindah').value,
                alasan: document.getElementById('formAlasan').value,
                file_bukti: uploadedFilesBase64.join(" ||| ")
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'submitUsulan', payload: payload })
                });
                
                const res = await response.json();
                hideLoader();
                
                if (res.status === 'success') {
                    showCustomAlert("Berhasil! Usulan penyesuaian Anda telah dikirim dan menunggu verifikasi Admin.", "Sukses");
                    document.getElementById('pindahForm').reset();
                    document.getElementById('pindahForm').style.display = 'none';
                    radios.forEach(r => r.checked = false);
                    document.getElementById('fileList').innerHTML = '';
                    document.getElementById('fileList').style.display = 'none';
                } else {
                    showCustomAlert("Gagal: " + res.message, "Error");
                }
            } catch (error) {
                hideLoader();
                showCustomAlert("Simulasi Berhasil: Data Usulan disimpan (Backend terisolasi saat Canvas Mode).", "Simulasi Sukses");
                document.getElementById('pindahForm').reset();
                document.getElementById('fileList').innerHTML = '';
                document.getElementById('fileList').style.display = 'none';
                radios.forEach(r => r.checked = false);
            }
        });

        // Admin Table Render
        function renderAdminTable() {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';
            
            if(!dbData.usulan || dbData.usulan.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Belum ada data usulan</td></tr>';
                return;
            }

            dbData.usulan.forEach(item => {
                let statClass = 'status-pending';
                if(item.Status === 'Diterima' || item.Status === 'Selesai') statClass = 'status-accepted';
                if(item.Status === 'Ditolak') statClass = 'status-rejected';

                let txtWilayah = `Prov: ${item['Nama Prov']}`;
                if(item['Unit Baru'] !== 'DPW') txtWilayah += `<br>Kab: ${item['Nama Kab']}`;
                if(item['Instansi Baru'] && item['Instansi Baru'] !== '-') txtWilayah += `<br>Instansi: ${item['Instansi Baru']}`;

                // Bukti Files (jika ada)
                let btnBukti = item['File Bukti'] ? `<button class="btn-copy" style="background:#8b5cf6;" onclick="showCustomAlert('Fitur lihat bukti file base64.', 'Lampiran')">Lihat Foto</button>` : '-';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item['Nama Lengkap'] || '-'}</td>
                    <td>
                        ${item['Nomor WA'] || '-'}
                        <br>
                        <button class="action-btns btn-copy" onclick="copyWA('${item['Nomor WA']}')" style="margin-top:5px;">Salin WA</button>
                    </td>
                    <td>${item['Lokasi Awal'] || '-'}<br><small>${item['SK Awal']||''}</small></td>
                    <td>
                        <b>Unit: ${item['Unit Baru'] || '-'}</b><br>
                        <span style="font-size:11px; color:#cbd5e1;">${txtWilayah}</span>
                    </td>
                    <td style="max-width:150px; font-size:11px;">${item['Alasan'] || '-'}</td>
                    <td>${btnBukti}</td>
                    <td><span class="status-badge ${statClass}">${item.Status || 'Pending'}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-acc" onclick="changeStatus('${item.ID}', 'Diterima')">Terima</button>
                            <button class="btn-rej" onclick="changeStatus('${item.ID}', 'Ditolak')">Tolak</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function changeStatus(id, newStatus) {
            // Gunakan konfirmasi bawaan krn custom alert async lebih ribet diimplementasikan via innerHTML
            if(!confirm(`Yakin menandai usulan ini sebagai ${newStatus}?`)) return; 
            
            showLoader("Memperbarui Status...");
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'updateStatus', payload: { id: id, status: newStatus } })
                });
                const res = await response.json();
                hideLoader();
                
                if (res.status === 'success') {
                    showCustomAlert("Status berhasil diubah!", "Sukses");
                    let target = dbData.usulan.find(u => u.ID == id);
                    if(target) target.Status = newStatus;
                    renderAdminTable();
                } else {
                    showCustomAlert("Gagal memperbarui: " + res.message, "Error");
                }
            } catch (err) {
                hideLoader();
                showCustomAlert("Simulasi: Status berhasil diubah menjadi " + newStatus, "Simulasi");
            }
        }

        function copyWA(wa) {
            const temp = document.createElement('textarea');
            temp.value = wa;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showCustomAlert('Nomor WA disalin: ' + wa, 'Berhasil');
        }

        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function showLoader(text) {
            if(text) loaderText.innerText = text;
            loader.style.display = 'flex';
        }

        function hideLoader() { loader.style.display = 'none'; }

        function logout() {
            currentUser = null;
            document.getElementById('loginForm').reset();
            showView('loginView');
        }

        // Fitur Rahasia Admin (Klik Logo)
        document.querySelectorAll('.admin-logo-btn').forEach(logo => {
            logo.addEventListener('click', () => {
                const code = prompt("Masukkan Kode Akses Admin:");
                if (code === null) return; 
                
                let validCode = "123"; 
                if (dbData && dbData.config) {
                    const configRow = dbData.config.find(c => c.Key === 'admin_code' || c.key === 'admin_code');
                    if (configRow) validCode = configRow.Value || configRow.value;
                }

                if (code === validCode) {
                    if(!currentUser) {
                        currentUser = { nama: "Super Admin", role: "admin" }; // Bypass object
                    }
                    renderAdminTable();
                    showView('adminView');
                } else {
                    showCustomAlert("Kode akses salah!", "Akses Ditolak");
                }
            });
        });

        document.addEventListener("DOMContentLoaded", initApp);
    </script>
