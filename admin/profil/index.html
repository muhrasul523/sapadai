        // --- CORE FUNCTIONS ---
        function startLoading(text) { 
            if(text) document.querySelector('#global-loader h5').innerText = text;
            document.getElementById('global-loader').style.display = 'flex'; 
        }
        function endLoading() { document.getElementById('global-loader').style.display = 'none'; }

        // --- HELPER FORMAT TANGGAL INDONESIA ---
        function formatTanggalIndo(dateStr) {
            if (!dateStr || dateStr.trim() === "") return '-';
            
            let dateObj;
            // Cek jika formatnya YYYY-MM-DD
            if (dateStr.includes('-')) {
                const parts = dateStr.split('-');
                if(parts.length === 3) dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
            } else if (dateStr.includes('/')) {
                // Cek jika formatnya DD/MM/YYYY
                const parts = dateStr.split('/');
                if(parts.length === 3) dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
            } else {
                // Fallback parsing default
                dateObj = new Date(dateStr);
            }

            if (isNaN(dateObj.getTime())) return dateStr;

            const bulanIndo = [
                'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 
                'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
            ];
            
            const tanggal = dateObj.getDate();
            const bulan = bulanIndo[dateObj.getMonth()];
            const tahun = dateObj.getFullYear();

            return `${tanggal} ${bulan} ${tahun}`;
        }

        // --- HELPER IMAGE DRIVE URL ---
        function getDirectDriveLink(url) {
            if (!url) return '';
            
            // Jika URL sudah mengandung format lh3 (Google Photos/Drive direct URL)
            if (url.includes('lh3.googleusercontent.com')) return url;

            // Ekstrak ID dari format drive.google.com/uc?id=... atau drive.google.com/file/d/...
            const matchId = url.match(/[?&]id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            
            if (matchId && matchId[1]) {
                // Return menggunakan lh3 endpoint untuk memastikan render gambar yang stabil
                return `https://lh3.googleusercontent.com/d/${matchId[1]}`;
            }
            return url;
        }

        function verifyAccess(code) {

        function renderUI() {

            const tbody = document.getElementById('table-body');
            let html = '';
            
            validData.forEach((item, index) => {
                // Gunakan nama lengkap beserta gelar jika ada, jika tidak, gunakan nama tanpa gelar

                        </td>

            if(!data) return;

            // Ambil dan format direct link untuk gambar
            const fotoWajah = getDirectDriveLink(data.foto_wajah_url) || 'https://placehold.co/400x500/f1f5f9/64748b?text=Tidak+Ada+Foto';
            const fotoKtp = getDirectDriveLink(data.foto_ktp_url) || 'https://placehold.co/500x300/f1f5f9/64748b?text=Tidak+Ada+KTP';
            
            // Format nama
            const namaTampil = data.nama_lengkap_beserta_gelar || data.nama_lengkap_tanpa_gelar || 'Tanpa Nama';

            // Generate HTML Data Istri jika status menikah
            let istriHtml = '';
            if (data.status_pernikahan === 'MENIKAH') {
                const jmlIstri = parseInt(data.jumlah_istri) || 0;
                for (let i = 1; i <= jmlIstri; i++) {
                    if (data[`istri_${i}_nama`]) {
                        istriHtml += `
                            <div class="p-3 mb-3 bg-light rounded-3 border border-light shadow-sm">
                                <h6 class="text-primary fw-bolder mb-3"><i class="bi bi-person-heart me-1"></i> Istri Ke-${i}</h6>
                                <div class="row">
                                    <div class="col-md-4 mb-2"><div class="data-label">Nama Lengkap</div><div class="data-value fw-bold text-dark">${data[`istri_${i}_nama`] || '-'}</div></div>
                                    <div class="col-md-4 mb-2"><div class="data-label">Tanggal Lahir</div><div class="data-value">${formatTanggalIndo(data[`istri_${i}_tgl_lahir`])}</div></div>
                                    <div class="col-md-4 mb-2"><div class="data-label">No. WA</div><div class="data-value">${data[`istri_${i}_wa`] || '-'}</div></div>
                                    <div class="col-md-4 mb-2"><div class="data-label">NIK</div><div class="data-value">${data[`istri_${i}_nik`] || '-'}</div></div>
                                    <div class="col-md-4 mb-2"><div class="data-label">Jumlah Anak</div><div class="data-value">${data[`istri_${i}_anak`] || '0'}</div></div>
                                </div>
                            </div>
                        `;
                    }
                }
            }

            const modalHtml = `
                <div class="row">
                    <!-- KOLOM KIRI (FOTO & INFO UTAMA) -->
                    <div class="col-lg-4 mb-4">
                        <div class="detail-section text-center">
                            <!-- Foto Wajah -->
                            <img src="${fotoWajah}" class="img-preview-box img-wajah mb-3" alt="Foto Wajah" 
                                 onerror="this.src='https://placehold.co/400x500/f1f5f9/ef4444?text=Gagal+Muat'">
                            
                            <h5 class="fw-bolder text-dark mb-1">${namaTampil}</h5>
                            <p class="text-muted small fw-bold mb-3">${data.dai_id || '-'}</p>
                            <span class="badge bg-primary px-4 py-2 rounded-pill shadow-sm fs-6">${data.marhalah || 'Marhalah -'}</span>
                        </div>
                        
                        <div class="detail-section">
                            <div class="detail-title"><i class="bi bi-person-lines-fill me-2"></i>Identitas Dasar</div>
                            <div class="data-label">Email</div><div class="data-value">${data.email || '-'}</div>
                            <div class="data-label">NIK KTP</div><div class="data-value font-monospace">${data.nik || '-'}</div>
                            <div class="data-label">Nama Sesuai KTP</div><div class="data-value fw-bold">${data.nama_sesuai_ktp || '-'}</div>
                        </div>

                        <div class="detail-section text-center">
                             <div class="detail-title text-start"><i class="bi bi-credit-card-2-front me-2"></i>Scan / Foto KTP</div>
                             <!-- Foto KTP -->
                             <img src="${fotoKtp}" class="img-preview-box img-ktp mt-2" alt="Foto KTP"
                                  onerror="this.src='https://placehold.co/500x300/f1f5f9/ef4444?text=Gagal+Muat'">
                        </div>
                    </div>

                    <!-- KOLOM KANAN (DETAIL LENGKAP) -->
                    <div class="col-lg-8">
                        <div class="detail-section">
                            <div class="detail-title"><i class="bi bi-journal-bookmark-fill me-2"></i>Biodata & Pendidikan</div>
                            <div class="row">
                                <div class="col-sm-6"><div class="data-label">Tempat Lahir</div><div class="data-value">${data.tempat_lahir || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Tanggal Lahir</div><div class="data-value fw-bold text-primary">${formatTanggalIndo(data.tanggal_lahir)}</div></div>
                                <div class="col-sm-6"><div class="data-label">Pendidikan Terakhir</div><div class="data-value">${data.pendidikan_terakhir || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Status Alumni</div><div class="data-value">${data.alumni || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Tahun Diutus</div><div class="data-value"><span class="badge bg-secondary">${data.tahun_diutus || '-'}</span></div></div>
                                <div class="col-sm-6"><div class="data-label">Terakhir Update</div><div class="data-value small fst-italic text-muted">${data.timestamp || 'Belum pernah update via form'}</div></div>
                            </div>
                        </div>

                        <div class="detail-section">
                            <div class="detail-title"><i class="bi bi-geo-alt-fill me-2"></i>Alamat & Wilayah Tugas</div>
                            <div class="row mb-3">
                                <div class="col-12"><h6 class="text-dark fw-bolder bg-light p-2 rounded"><i class="bi bi-building-check me-2 text-success"></i>Domisili Tugas Saat Ini</h6></div>
                                <div class="col-sm-6"><div class="data-label">Provinsi</div><div class="data-value">${data.domisili_prov || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Kabupaten / Kota</div><div class="data-value">${data.domisili_kabkota || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Kecamatan</div><div class="data-value">${data.domisili_kec || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Desa / Kelurahan</div><div class="data-value">${data.domisili_desakel || '-'}</div></div>
                            </div>
                            <hr class="border-light opacity-50">
                            <div class="row">
                                <div class="col-12"><h6 class="text-dark fw-bolder bg-light p-2 rounded"><i class="bi bi-house-door me-2 text-secondary"></i>Alamat Asal</h6></div>
                                <div class="col-sm-6"><div class="data-label">Provinsi Asal</div><div class="data-value">${data.asal_prov || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Kabupaten / Kota Asal</div><div class="data-value">${data.asal_kabkota || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Kecamatan Asal</div><div class="data-value">${data.asal_kec || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Desa / Kelurahan Asal</div><div class="data-value">${data.asal_desakel || '-'}</div></div>
                            </div>
                        </div>

                        <div class="detail-section">
                            <div class="detail-title"><i class="bi bi-people-fill me-2"></i>Keluarga & Asuransi</div>
                            <div class="row mb-3">
                                <div class="col-sm-4"><div class="data-label">Status Pernikahan</div><div class="data-value fw-bold ${data.status_pernikahan === 'MENIKAH' ? 'text-success' : 'text-warning'}">${data.status_pernikahan || '-'}</div></div>
                                <div class="col-sm-4"><div class="data-label">Total Istri</div><div class="data-value fw-bolder fs-5">${data.jumlah_istri || '0'}</div></div>
                                <div class="col-sm-4"><div class="data-label">Total Anak</div><div class="data-value fw-bolder fs-5">${data.jumlah_anak || '0'}</div></div>
                            </div>
                            <div class="row mb-4">
                                <div class="col-sm-6"><div class="data-label">Nama Ayah Kandung</div><div class="data-value">${data.nama_ayah_kandung || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Nama Ibu Kandung</div><div class="data-value">${data.nama_ibu_kandung || '-'}</div></div>
                            </div>
                            <!-- Menampilkan Data Istri Jika Ada -->
                            ${istriHtml}
                        </div>

                        <div class="detail-section">
                            <div class="detail-title"><i class="bi bi-diagram-3-fill me-2"></i>Struktural & Keuangan</div>
                            <div class="row mb-3">
                                <div class="col-sm-6"><div class="data-label">Pimpinan / Ketua</div><div class="data-value fw-bold">${data.nama_pimpinan || '-'} <br><span class="badge bg-light text-dark border fw-normal mt-1">${data.jabatan_pimpinan || '-'}</span></div></div>
                                <div class="col-sm-6"><div class="data-label">No. WA Pimpinan</div><div class="data-value font-monospace">${data.wa_pimpinan || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Nama Murabbi</div><div class="data-value">${data.nama_murabbi || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">No. WA Murabbi</div><div class="data-value font-monospace">${data.wa_murabbi || '-'}</div></div>
                            </div>
                            <hr class="border-light opacity-50">
                            <div class="row mt-3">
                                <div class="col-sm-6"><div class="data-label">Status BPJS</div><div class="data-value">${data.jenis_bpjs || '-'}</div></div>
                                <div class="col-sm-6"><div class="data-label">Rekening Berkah Mobile</div><div class="data-value font-monospace">${data.rekening_berkah_mobile || '-'}</div></div>
                                <div class="col-12 mt-2">
                                    <div class="p-3 bg-light rounded border border-light">
                                        <div class="row">
                                            <div class="col-sm-4"><div class="data-label">Bank</div><div class="data-value fw-bold text-primary">${data.nama_bank === 'LAINNYA (input manual)' ? data.nama_bank_lainnya : data.nama_bank}</div></div>
                                            <div class="col-sm-4"><div class="data-label">No. Rekening</div><div class="data-value font-monospace fw-bold fs-6">${data.nomor_rekening || '-'}</div></div>
                                            <div class="col-sm-4"><div class="data-label">Atas Nama</div><div class="data-value">${data.nama_pemilik || '-'}</div></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;

            document.getElementById('modal-content-body').innerHTML = modalHtml;
            const modal = new bootstrap.Modal(document.getElementById('detailModal'));
            modal.show();
        }
    </script>
</body>
</html>
