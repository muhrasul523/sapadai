<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Status Laporan Dai</title>
    
    <!-- Library CSS & JS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .wahdah-bg { background-color: #0f766e; } 
        .wahdah-text { color: #0f766e; }
        
        /* Blur Loading Overlay */
        #loading-overlay { display: none; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(5px); z-index: 9999; }
        .spinner { border: 4px solid rgba(15, 118, 110, 0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #0f766e; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .tab-btn.active { background-color: #0f766e; color: white; border-color: #0f766e; }
        .tab-btn { background-color: white; color: #374151; border: 1px solid #d1d5db; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="antialiased selection:bg-teal-200 selection:text-teal-900">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 flex flex-col justify-center items-center">
        <div class="spinner mb-4"></div>
        <h2 class="text-xl font-semibold wahdah-text" id="loading-text">Memuat...</h2>
    </div>

    <!-- Halaman Login -->
    <div id="login-page" class="min-h-screen flex items-center justify-center p-4 bg-gray-50">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-6">
                <!-- Logo Dummy mirip dengan referensi -->
                <div class="mx-auto w-20 h-20 bg-gradient-to-tr from-teal-500 to-yellow-400 rounded-2xl flex items-center justify-center mb-4 shadow-lg text-white font-bold text-3xl">
                    SD
                </div>
                <h1 class="text-2xl font-bold text-gray-800 tracking-wide">LAPORAN KINERJA</h1>
                <p class="text-sm text-gray-500 uppercase tracking-widest mt-1">Dai Utusan Wahdah Islamiyah</p>
            </div>
            
            <!-- Login Tabs -->
            <div class="flex border-b border-gray-200 mb-6">
                <button onclick="setLoginType('wa')" id="tab-login-wa" class="flex-1 py-3 text-sm font-bold text-teal-700 border-b-2 border-teal-600 transition">
                    <i class="fab fa-whatsapp mr-1"></i> No. WA
                </button>
                <button onclick="setLoginType('email')" id="tab-login-email" class="flex-1 py-3 text-sm font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-600 transition">
                    <i class="fas fa-envelope mr-1"></i> Email
                </button>
            </div>

            <form onsubmit="event.preventDefault(); submitLogin();" class="space-y-5">
                <div>
                    <label id="label-username" class="block text-sm font-medium text-gray-700 mb-1">Nomor WhatsApp</label>
                    <input type="text" id="input-username" required class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 bg-gray-50 text-gray-800" placeholder="Contoh: 628123456789">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi</label>
                    <div class="relative">
                        <input type="password" id="input-password" required class="w-full p-3 pr-10 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 bg-gray-50 text-gray-800" placeholder="Masukkan kata sandi">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye" id="icon-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full wahdah-bg text-white font-bold py-3 px-4 rounded-lg hover:bg-teal-800 transition shadow-md mt-6 flex justify-center items-center gap-2">
                    <i class="fas fa-sign-in-alt"></i> Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- Aplikasi Utama -->
    <div id="main-app" class="hidden min-h-screen pb-20">
        <!-- Navbar -->
        <nav class="wahdah-bg text-white p-4 sticky top-0 z-40 shadow-md">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
                <div class="font-bold text-lg flex items-center gap-3">
                    <div class="w-8 h-8 bg-white text-teal-700 rounded flex items-center justify-center font-bold text-sm">SD</div>
                    <span class="hidden sm:inline">Status Laporan Dai</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-sm text-right">
                        <p class="font-semibold leading-none truncate max-w-[150px] md:max-w-xs" id="user-info-name">Nama Dai</p>
                        <span class="text-[10px] text-teal-200 uppercase tracking-wider" id="user-info-id">ID: -</span>
                    </div>
                    <button onclick="logout()" class="text-sm bg-teal-800 hover:bg-teal-900 text-white p-2 md:px-4 md:py-2 rounded-lg transition shadow">
                        <i class="fas fa-power-off"></i><span class="hidden sm:inline ml-2">Keluar</span>
                    </button>
                </div>
            </div>
        </nav>

        <div class="max-w-5xl mx-auto mt-6 px-4">
            
            <!-- Navigasi Tab -->
            <div class="flex gap-2 w-full mb-6 bg-white p-2 rounded-xl shadow-sm border border-gray-100">
                <button onclick="switchTab('status')" id="btn-tab-status" class="flex-1 px-4 py-3 tab-btn active rounded-lg text-sm font-bold transition shadow-sm flex justify-center items-center gap-2">
                    <i class="fas fa-calendar-check"></i> <span class="hidden sm:inline">Cek per</span> Bulan
                </button>
                <button onclick="switchTab('rekap')" id="btn-tab-rekap" class="flex-1 px-4 py-3 tab-btn rounded-lg text-sm font-bold transition shadow-sm flex justify-center items-center gap-2">
                    <i class="fas fa-list"></i> Rekap <span class="hidden sm:inline">Keseluruhan</span>
                </button>
            </div>

            <!-- TAB 1: Cek Status Per Bulan -->
            <div id="tab-status" class="space-y-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Pilih Bulan Laporan</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="far fa-calendar-alt text-teal-600"></i></div>
                        <select id="filter-bulan" class="w-full pl-10 pr-8 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 font-bold focus:ring-2 focus:ring-teal-500 appearance-none cursor-pointer transition" onchange="renderStatusBulan()"></select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none"><i class="fas fa-chevron-down text-gray-400 text-sm"></i></div>
                    </div>
                </div>

                <!-- Hasil Card -->
                <div id="hasil-status-container">
                    <!-- Dirender via JS -->
                </div>
            </div>

            <!-- TAB 2: Rekap Keseluruhan -->
            <div id="tab-rekap" class="hidden space-y-4">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 bg-gray-50 border-b flex items-center gap-2">
                        <i class="fas fa-history text-teal-600"></i>
                        <h3 class="font-bold text-gray-800">Riwayat Seluruh Laporan</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse whitespace-nowrap">
                            <thead class="bg-white text-gray-500 border-b text-xs uppercase tracking-wider">
                                <tr>
                                    <th class="p-4 font-bold">Bulan Laporan</th>
                                    <th class="p-4 font-bold text-center">Status Akhir</th>
                                    <th class="p-4 font-bold">Waktu Verifikasi</th>
                                </tr>
                            </thead>
                            <tbody id="table-rekap-body" class="divide-y divide-gray-100 text-sm bg-white">
                                <!-- Dirender via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI APLIKASI
        // ==========================================
        // Masukkan URL WebApp Google Apps Script Anda di sini
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwz4-XAlbLmDPtbr8kN1u0P0ZU8UNAEtPQqWx6Dm_iwk81y8oxPRM3PcfpqPbFwEn9b/exec';
        
        // Deteksi Mode Simulasi: Jika URL kosong atau berjalan di environment lokal tanpa server
        const isSimulation = SCRIPT_URL.trim() === '' || window.location.protocol === 'file:';

        // State Aplikasi
        let currentLoginType = 'wa';
        let currentUser = null;
        let riwayatData = [];
        let availableMonths = [];

        // Dummy Data untuk Mode Simulasi (Canvas)
        const dummyDb = {
            users: [
                { dai_id: "SDI-001", nomor_wa: "0812", email: "dai@mail.com", password: "123", nama_dai: "Ahmad Dummy" }
            ],
            riwayat: [
                { timestamp: "25/09/2026 10:00:00", id_verifikator: "V-01", nama_verifikator: "Admin", bulan_laporan: "September 2026", id_dai: "SDI-001", id_laporan: "LAP-01", status: "Diterima", catatan: "Laporan lengkap, syukron.", timestamp_laporan: "24/09/2026 08:00:00" },
                { timestamp: "26/10/2026 09:30:00", id_verifikator: "V-01", nama_verifikator: "Admin", bulan_laporan: "Oktober 2026", id_dai: "SDI-001", id_laporan: "LAP-02", status: "Ditolak", catatan: "Mohon perbaiki bukti foto kegiatan tablig.", timestamp_laporan: "25/10/2026 16:20:00" }
            ]
        };

        // ==========================================
        // UI HELPERS
        // ==========================================
        function showLoading(text) { document.getElementById('loading-text').innerText = text || 'Memuat...'; document.getElementById('loading-overlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }
        
        function setLoginType(type) {
            currentLoginType = type;
            const tabWa = document.getElementById('tab-login-wa');
            const tabEmail = document.getElementById('tab-login-email');
            const labelUser = document.getElementById('label-username');
            const inputUser = document.getElementById('input-username');
            
            if(type === 'wa') {
                tabWa.className = 'flex-1 py-3 text-sm font-bold text-teal-700 border-b-2 border-teal-600 transition';
                tabEmail.className = 'flex-1 py-3 text-sm font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-600 transition';
                labelUser.innerText = 'Nomor WhatsApp';
                inputUser.placeholder = 'Contoh: 628123456789';
                inputUser.type = 'number';
            } else {
                tabEmail.className = 'flex-1 py-3 text-sm font-bold text-teal-700 border-b-2 border-teal-600 transition';
                tabWa.className = 'flex-1 py-3 text-sm font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-600 transition';
                labelUser.innerText = 'Alamat Email';
                inputUser.placeholder = 'email@contoh.com';
                inputUser.type = 'email';
            }
            inputUser.value = '';
        }

        function togglePassword() {
            const input = document.getElementById('input-password');
            const icon = document.getElementById('icon-eye');
            if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { input.type = 'password'; icon.className = 'fas fa-eye'; }
        }

        function switchTab(tab) {
            document.getElementById('tab-status').style.display = tab === 'status' ? 'block' : 'none';
            document.getElementById('tab-rekap').style.display = tab === 'rekap' ? 'block' : 'none';
            
            document.getElementById('btn-tab-status').className = tab === 'status' ? 'flex-1 px-4 py-3 tab-btn active rounded-lg text-sm font-bold transition shadow-sm flex justify-center items-center gap-2' : 'flex-1 px-4 py-3 tab-btn rounded-lg text-sm font-bold transition shadow-sm flex justify-center items-center gap-2';
            document.getElementById('btn-tab-rekap').className = tab === 'rekap' ? 'flex-1 px-4 py-3 tab-btn active rounded-lg text-sm font-bold transition shadow-sm flex justify-center items-center gap-2' : 'flex-1 px-4 py-3 tab-btn rounded-lg text-sm font-bold transition shadow-sm flex justify-center items-center gap-2';
        }

        // ==========================================
        // LOGIC & DATA PROCESSING
        // ==========================================
        function submitLogin() {
            const userVal = document.getElementById('input-username').value;
            const passVal = document.getElementById('input-password').value;

            if(!userVal || !passVal) { Swal.fire('Error', 'Harap isi semua kolom.', 'warning'); return; }

            const payload = { type: currentLoginType, username: userVal, password: passVal };
            showLoading('Otentikasi...');

            if (isSimulation) {
                // Proses Dummy Login
                setTimeout(() => {
                    const user = dummyDb.users.find(u => (currentLoginType === 'wa' ? u.nomor_wa === userVal : u.email === userVal) && u.password === passVal);
                    if(user) { processLoginSuccess({ user: user, riwayat: dummyDb.riwayat }); } 
                    else { hideLoading(); Swal.fire('Gagal', 'Kredensial Dummy Salah (Gunakan WA: 0812, Pass: 123)', 'error'); }
                }, 800);
                return;
            }

            // Proses Real Login (Fetch ke GAS WebApp)
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', data: payload })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) { processLoginSuccess(data); } 
                else { hideLoading(); Swal.fire('Gagal Login', data.message, 'error'); }
            })
            .catch(err => {
                hideLoading();
                Swal.fire('Error Koneksi', 'Tidak dapat terhubung ke server. Pastikan SCRIPT_URL benar.', 'error');
                console.error(err);
            });
        }

        function processLoginSuccess(data) {
            currentUser = data.user;
            riwayatData = data.riwayat || [];
            
            // Set User Info di Navbar
            document.getElementById('user-info-name').innerText = currentUser.nama_dai;
            document.getElementById('user-info-id').innerText = `ID: ${currentUser.dai_id}`;

            // Ekstrak Bulan Unik (pastikan dari data riwayat)
            const bulanSet = new Set();
            riwayatData.forEach(r => { if(r.bulan_laporan) bulanSet.add(r.bulan_laporan); });
            availableMonths = Array.from(bulanSet);
            // Default sort (asumsi string berakhiran tahun, bisa disesuaikan)
            availableMonths.reverse(); 

            // Isi Dropdown Bulan
            const selBulan = document.getElementById('filter-bulan');
            selBulan.innerHTML = '';
            if(availableMonths.length === 0) {
                selBulan.add(new Option("-- Belum Ada Riwayat Laporan --", ""));
            } else {
                selBulan.add(new Option("-- Pilih Bulan Laporan --", ""));
                availableMonths.forEach(b => selBulan.add(new Option(b, b)));
                selBulan.value = availableMonths[0]; // Set default terbaru
            }

            hideLoading();
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';

            renderStatusBulan();
            renderRekapKeseluruhan();
        }

        function logout() {
            currentUser = null;
            riwayatData = [];
            document.getElementById('input-password').value = '';
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('login-page').style.display = 'flex';
        }

        // ==========================================
        // RENDER TABS
        // ==========================================
        function getBadge(status) {
            let bg = 'bg-gray-100 text-gray-700', icon = 'fa-clock';
            if(status === 'Diterima') { bg = 'bg-green-100 text-green-700 border-green-200'; icon = 'fa-check-circle'; }
            else if(status === 'Ditolak' || status === 'Revisi') { bg = 'bg-red-100 text-red-700 border-red-200'; icon = 'fa-times-circle'; }
            else if(status === 'Menunggu') { bg = 'bg-yellow-100 text-yellow-700 border-yellow-200'; icon = 'fa-hourglass-half'; }
            return `<span class="px-3 py-1.5 rounded-full text-xs font-bold border ${bg} inline-flex items-center gap-1.5 uppercase tracking-wide"><i class="fas ${icon}"></i> ${status}</span>`;
        }

        function renderStatusBulan() {
            const bulan = document.getElementById('filter-bulan').value;
            const container = document.getElementById('hasil-status-container');
            
            if(!bulan) {
                container.innerHTML = `<div class="bg-white p-8 rounded-xl border border-gray-100 text-center text-gray-400 shadow-sm"><i class="fas fa-file-alt text-4xl mb-3 opacity-20"></i><p>Pilih bulan pada dropdown di atas untuk melihat detail.</p></div>`;
                return;
            }

            // Ambil riwayat untuk bulan tersebut (bisa > 1 jika ada revisi, kita ambil yang paling akhir/terbaru dari array)
            const riwayatBulan = riwayatData.filter(r => r.bulan_laporan === bulan);
            if(riwayatBulan.length === 0) return; // Seharusnya tidak terjadi

            const latest = riwayatBulan[riwayatBulan.length - 1]; // Asumsi baris terbawah di sheet adalah yang terbaru
            
            let cardHtml = `
            <div class="bg-white rounded-xl shadow-md border-t-4 ${latest.status === 'Diterima' ? 'border-green-500' : (latest.status === 'Ditolak' ? 'border-red-500' : 'border-yellow-500')} overflow-hidden relative">
                <div class="p-5 border-b border-gray-100 bg-gray-50 flex justify-between items-start">
                    <div>
                        <h4 class="font-bold text-gray-800 text-lg mb-1">${latest.bulan_laporan}</h4>
                        <p class="text-xs text-gray-500"><i class="fas fa-user text-teal-600 mr-1"></i> ${currentUser.nama_dai}</p>
                    </div>
                    <div>${getBadge(latest.status)}</div>
                </div>
                
                <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-4">
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1">Waktu Laporan Masuk</p>
                            <p class="font-semibold text-gray-800 text-sm"><i class="far fa-calendar-plus mr-1.5 text-blue-500"></i> ${latest.timestamp_laporan || '-'}</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1">Diverifikasi Pada</p>
                            <p class="font-semibold text-gray-800 text-sm"><i class="far fa-calendar-check mr-1.5 text-teal-500"></i> ${latest.timestamp || '-'}</p>
                        </div>
                    </div>
                    
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 h-full">
                        <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-2">Catatan Verifikator</p>
                        <p class="text-sm font-medium ${latest.catatan && latest.catatan !== '-' ? 'text-gray-700' : 'text-gray-400 italic'} break-words">
                            ${latest.catatan && latest.catatan !== '-' ? latest.catatan : 'Tidak ada catatan.'}
                        </p>
                    </div>
                </div>
            </div>`;

            // Jika ada histori sebelumnya untuk bulan yang sama, tampilkan
            if(riwayatBulan.length > 1) {
                cardHtml += `
                <div class="mt-4 bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                    <h5 class="text-xs font-bold text-gray-500 uppercase mb-3"><i class="fas fa-history mr-1"></i> Histori Pemeriksaan Terdahulu</h5>
                    <div class="space-y-3">`;
                
                // Looping terbalik tanpa mengikutkan yang terakhir
                for(let i = riwayatBulan.length - 2; i >= 0; i--) {
                    let old = riwayatBulan[i];
                    cardHtml += `
                        <div class="flex items-start gap-3 p-3 bg-gray-50 rounded border text-sm">
                            <div class="mt-0.5">${getBadge(old.status)}</div>
                            <div class="flex-1">
                                <p class="text-xs text-gray-500 mb-1">Oleh ${old.nama_verifikator} pada ${old.timestamp}</p>
                                <p class="text-gray-700 font-medium">"${old.catatan || '-'}"</p>
                            </div>
                        </div>`;
                }
                cardHtml += `</div></div>`;
            }

            container.innerHTML = cardHtml;
        }

        function renderRekapKeseluruhan() {
            const tbody = document.getElementById('table-rekap-body');
            
            if(availableMonths.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-gray-500">Belum ada riwayat laporan yang diverifikasi.</td></tr>`;
                return;
            }

            let html = '';
            // Gunakan availableMonths (sudah urut)
            availableMonths.forEach(bulan => {
                // Ambil status terakhir untuk bulan tersebut
                const riwayatBulan = riwayatData.filter(r => r.bulan_laporan === bulan);
                const latest = riwayatBulan[riwayatBulan.length - 1];
                
                html += `
                <tr class="hover:bg-gray-50 transition border-b border-gray-100">
                    <td class="p-4 font-bold text-gray-800">${bulan}</td>
                    <td class="p-4 text-center">${getBadge(latest.status)}</td>
                    <td class="p-4 text-sm text-gray-600">${latest.timestamp || '-'}</td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }
    </script>
</body>
</html>
