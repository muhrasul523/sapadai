<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTAL KINERJA & KAFALAH DAI</title>
    
    <link rel="icon" type="image/png" href="https://sapadai.wadahdigital.my.id/logo_sapadai_1.png">
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .wahdah-bg { background-color: #0f766e; } 
        .wahdah-text { color: #0f766e; }
        
        #loading-overlay { display: none; background: rgba(255, 255, 255, 0.95); z-index: 9999; }
        .spinner { border: 4px solid rgba(15, 118, 110, 0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #0f766e; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .tab-btn.active { background-color: #0f766e; color: white; border-color: #0f766e; }
        .tab-btn { background-color: white; color: #374151; border: 1px solid #d1d5db; }
        
        .login-tab.active { border-bottom: 2px solid #0f766e; color: #0f766e; font-weight: 600; background-color: #f0fdfa; }
        .login-tab { border-bottom: 2px solid transparent; color: #6b7280; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .card-header-custom { background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 12px 16px; font-weight: 700; text-transform: uppercase; color: #0f766e; border-top-left-radius: 0.5rem; border-top-right-radius: 0.5rem; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body class="antialiased selection:bg-teal-200 selection:text-teal-900">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 flex flex-col justify-center items-center">
        <div class="spinner mb-4"></div>
        <h2 class="text-xl font-semibold wahdah-text" id="loading-text">Memproses...</h2>
    </div>

    <!-- Halaman Login -->
    <div id="login-page" class="min-h-screen flex items-center justify-center p-4 bg-gray-50">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            <div class="text-center mb-6">
                <img src="https://sapadai.wadahdigital.my.id/logo_sapadai_1.png" alt="Logo" class="h-20 mx-auto mb-4 object-contain">
                <h1 class="text-xl font-bold text-gray-800 uppercase tracking-wide">PORTAL KINERJA DAI</h1>
                <p class="text-sm text-gray-500 font-semibold tracking-wide">WAHDAH ISLAMIYAH</p>
            </div>
            
            <div class="flex mb-6 border-b rounded-t-lg overflow-hidden">
                <div class="flex-1 text-center py-3 login-tab active" onclick="switchLoginTab('wa')"><i class="fab fa-whatsapp mr-2"></i>No. WA</div>
                <div class="flex-1 text-center py-3 login-tab" onclick="switchLoginTab('email')"><i class="fas fa-envelope mr-2"></i>Email</div>
            </div>
            
            <form id="login-form" class="space-y-6" onsubmit="event.preventDefault(); submitLogin();">
                <div id="div-login-wa">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nomor WhatsApp</label>
                    <input type="text" inputmode="numeric" id="login-wa" class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-teal-500 wa-validate numeric-only" placeholder="Contoh: 628123456789" required>
                </div>
                <div id="div-login-email" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Alamat Email</label>
                    <input type="email" id="login-email" class="w-full p-3 rounded-lg border focus:ring-2 focus:ring-teal-500" placeholder="contoh@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kata Sandi</label>
                    <div class="relative">
                        <input type="password" id="login-password" required class="w-full p-3 pr-10 rounded-lg border focus:ring-2 focus:ring-teal-500" placeholder="Masukkan kata sandi">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-gray-400 hover:text-gray-600" onclick="togglePassword()"><i class="fas fa-eye" id="eye-icon"></i></div>
                    </div>
                </div>
                <button type="submit" class="w-full wahdah-bg text-white font-bold py-3 px-4 rounded-lg hover:bg-teal-800 transition shadow-lg"><i class="fas fa-sign-in-alt mr-2"></i> Masuk</button>
            </form>
        </div>
    </div>

    <!-- Aplikasi Utama -->
    <div id="main-app" class="hidden min-h-screen pb-20">
        <!-- Navbar -->
        <nav class="wahdah-bg text-white p-4 sticky top-0 z-40 shadow-md">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
                <div class="font-bold text-lg flex items-center gap-3">
                    <img src="https://sapadai.wadahdigital.my.id/logo_sapadai_1.png" alt="Logo" class="h-8 w-8 bg-white p-1 rounded-full object-contain">
                    <span class="hidden sm:inline">Portal Kinerja Dai</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-sm text-right">
                        <p class="font-semibold leading-none truncate max-w-[150px] md:max-w-xs" id="user-info-name">Nama Dai</p>
                        <span class="text-[10px] text-teal-200 uppercase tracking-wider" id="user-info-id">ID: -</span>
                    </div>
                    <button onclick="logout()" class="text-sm border border-white hover:bg-white hover:text-teal-700 font-medium px-4 py-1.5 rounded transition"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </nav>

        <div class="max-w-5xl mx-auto mt-6 px-4 space-y-6">
            
            <!-- Dashboard Rekap -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
                <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                    <h2 class="font-bold text-lg text-gray-800"><i class="fas fa-chart-pie text-teal-600 mr-2"></i> Ringkasan Kinerja Keseluruhan</h2>
                    <button onclick="bukaModalGrafik()" class="bg-teal-50 border border-teal-200 text-teal-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-teal-100 transition shadow-sm"><i class="fas fa-chart-line mr-1"></i> Grafik</button>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-green-50 p-4 rounded-xl border border-green-100 text-center flex flex-col justify-center">
                        <p class="text-[10px] md:text-xs text-green-600 font-bold uppercase tracking-wide mb-1">Rata-Rata Kinerja</p>
                        <p class="text-3xl md:text-4xl font-black text-green-800" id="stat-avg-kinerja">0</p>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 text-center flex flex-col justify-center">
                        <p class="text-[10px] md:text-xs text-blue-600 font-bold uppercase tracking-wide mb-1">Rata-Rata Kafalah</p>
                        <p class="text-xl md:text-3xl font-black text-blue-800 mt-2 truncate" id="stat-avg-kafalah">Rp 0</p>
                    </div>
                </div>
            </div>

            <!-- Detail Per Bulan -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100">
                <div class="p-5 border-b border-gray-100 bg-gray-50 rounded-t-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h2 class="font-bold text-lg text-gray-800"><i class="fas fa-calendar-alt text-teal-600 mr-2"></i> Rincian Laporan Bulanan</h2>
                    </div>
                    <div class="w-full md:w-64 relative">
                        <select id="filter-bulan" class="w-full bg-white border border-teal-500 rounded-lg px-4 py-2.5 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-teal-500 cursor-pointer appearance-none shadow-sm" onchange="renderRincian()"></select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none"><i class="fas fa-chevron-down text-teal-600"></i></div>
                    </div>
                </div>

                <div class="p-5" id="rincian-container">
                    <!-- Placeholder sebelum render -->
                </div>
            </div>
            
        </div>
    </div>

    <!-- Modal Grafik -->
    <div id="modal-grafik" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-5 border-b sticky top-0 bg-white z-10">
                <h3 class="font-bold text-xl text-gray-800"><i class="fas fa-chart-line text-teal-600 mr-2"></i> Grafik Kronologis</h3>
                <button onclick="tutupModalGrafik()" class="text-gray-400 hover:text-red-500 text-2xl transition"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-10">
                <div>
                    <h4 class="text-sm font-bold text-center mb-3 text-gray-500 uppercase tracking-widest">Trend Nilai Kinerja</h4>
                    <canvas id="chartKinerja" height="80"></canvas>
                </div>
                <hr class="border-gray-200">
                <div>
                    <h4 class="text-sm font-bold text-center mb-3 text-gray-500 uppercase tracking-widest">Trend Total Kafalah</h4>
                    <canvas id="chartKafalah" height="80"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =====================================
        // URL WEB APP ANDA
        // =====================================
        const GITHUB_API_URL = "https://script.google.com/macros/s/AKfycbyGku6EvIXtUTHJ2zMD8KB6AspwE8KJU-uFwnQTXumRZCQdtFCLR59CqBwcuTcE2MGx/exec";

        let db = { user: null, laporan: [], listBulan: [] };
        let laporanDiterima = []; 
        let currentLoginType = 'wa';
        let chartInstanceKinerja = null;
        let chartInstanceKafalah = null;

        document.addEventListener('input', e => {
            if(e.target.classList.contains('numeric-only')) {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            }
            if(e.target.classList.contains('wa-validate')) {
                let v = e.target.value.replace(/[^0-9]/g, ''); 
                if(v.startsWith('08')) v = '628' + v.substring(2); 
                if(v.startsWith('8')) v = '628' + v.substring(1); 
                e.target.value = v;
            }
        });

        function showLoading(text) { document.getElementById('loading-text').innerText = text || 'Memproses...'; document.getElementById('loading-overlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }
        
        function switchLoginTab(type) {
            currentLoginType = type;
            document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active', 'bg-teal-50'));
            let target = type === 'wa' ? 0 : 1;
            document.querySelectorAll('.login-tab')[target].classList.add('active', 'bg-teal-50');
            
            document.getElementById('div-login-wa').classList.toggle('hidden', type !== 'wa');
            document.getElementById('div-login-email').classList.toggle('hidden', type === 'wa');
            document.getElementById('login-wa').required = (type === 'wa');
            document.getElementById('login-email').required = (type !== 'wa');
        }

        function togglePassword() {
            let pwd = document.getElementById('login-password');
            let icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') { pwd.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); } 
            else { pwd.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        // Format Rupiah yang tangguh
        function formatRupiah(angka) {
            if(angka === 0 || angka === '0') return 'Rp 0';
            if(!angka || angka === '-' || angka === '') return '-';
            
            if(typeof angka === 'number') {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(Math.round(angka));
            }
            
            let clean = String(angka).replace(/[^0-9]/g, '');
            if(clean === '') return '-';
            let val = parseInt(clean, 10);
            if(isNaN(val)) return angka;
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val);
        }

        function num(val) { 
            if(!val) return 0;
            let clean = String(val).replace(/[^0-9]/g, '');
            return Number(clean) || 0; 
        }

        // Memperbaiki format pembacaan tanggal (Menghandle format DD/MM/YYYY HH:mm:ss dari Google Sheets)
        function formatTanggalWITA(dateStr) {
            if(!dateStr || dateStr.trim() === '-' || dateStr.trim() === '') return '-';
            try {
                if (typeof dateStr === 'string' && dateStr.includes('/')) {
                    let parts = dateStr.trim().split(' ');
                    let d = parts[0].split('/'); 
                    if(d.length === 3) {
                        const bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
                        let timeParts = parts[1] ? parts[1].split(':') : ['00', '00'];
                        return `${parseInt(d[0])} ${bln[parseInt(d[1])-1]} ${d[2]} ${timeParts[0]}.${timeParts[1]} WITA`;
                    }
                }
                
                let d = new Date(dateStr);
                if(isNaN(d.getTime())) return dateStr; 
                
                const bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
                let jam = String(d.getHours()).padStart(2, '0');
                let mnt = String(d.getMinutes()).padStart(2, '0');
                
                return `${d.getDate()} ${bln[d.getMonth()]} ${d.getFullYear()} ${jam}.${mnt} WITA`;
            } catch(e) { return dateStr; }
        }

        function renderList(text) {
            if(!text || text.trim() === '-' || text.trim() === '') return '';
            let items = text.split(/\r?\n/).filter(i => i.trim() !== '');
            return '<ul class="list-disc pl-5 space-y-1">' + items.map(i => '<li>'+i+'</li>').join('') + '</ul>';
        }

        // ==========================
        // PROSES LOGIN
        // ==========================
        function submitLogin() {
            let u = currentLoginType === 'wa' ? document.getElementById('login-wa').value : document.getElementById('login-email').value;
            let p = document.getElementById('login-password').value;
            let credentials = { type: currentLoginType, username: u, password: p };

            showLoading('Memverifikasi & Sinkronisasi...');
            
            fetch(GITHUB_API_URL, {
                method: 'POST',
                redirect: 'follow', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'login', data: credentials })
            })
            .then(res => {
                if (!res.ok) throw new Error("Terjadi masalah pada network. HTTP Code: " + res.status);
                return res.json();
            })
            .then(res => {
                if(res.success) { processLoginSuccess(res); } 
                else { hideLoading(); Swal.fire('Gagal', res.message, 'error'); }
            })
            .catch(err => {
                hideLoading(); 
                console.error(err);
                Swal.fire('Error Koneksi', 'Gagal menghubungi server database. Pastikan Web App diperbarui dengan script backend terbaru.', 'error');
            });
        }

        function processLoginSuccess(data) {
            db = data;
            document.getElementById('user-info-name').innerText = db.user.nama;
            document.getElementById('user-info-id').innerText = `ID: ${db.user.id}`;

            // Saring hanya laporan diterima
            laporanDiterima = db.laporan.filter(k => (k.status || "").toLowerCase() === 'diterima');

            let totalKinerja = 0, totalKafalah = 0;
            laporanDiterima.forEach(k => {
                totalKinerja += parseFloat(k.nilai_kinerja || 0);
                totalKafalah += num(k.total_kafalah);
            });
            
            let jumlahBulanSistem = db.listBulan.length > 0 ? db.listBulan.length : 1; 
            let avgKinerja = (totalKinerja / jumlahBulanSistem).toFixed(1);
            let avgKafalah = (totalKafalah / jumlahBulanSistem);
            
            document.getElementById('stat-avg-kinerja').innerText = avgKinerja;
            document.getElementById('stat-avg-kafalah').innerText = formatRupiah(avgKafalah);

            const selBulan = document.getElementById('filter-bulan');
            selBulan.innerHTML = '';
            
            if(db.listBulan.length === 0) {
                selBulan.add(new Option("-- Data Bulan Kosong --", ""));
                document.getElementById('rincian-container').innerHTML = `<div class="text-center p-8 text-gray-400">Hubungi admin untuk setup bulan.</div>`;
            } else {
                let reversedBulan = [...db.listBulan].reverse();
                reversedBulan.forEach(b => selBulan.add(new Option(b, b)));
                renderRincian();
            }

            hideLoading();
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }

        function logout() { location.reload(); }

        function switchTabRincian(tab) {
            document.getElementById('tab-kinerja').style.display = tab === 'kinerja' ? 'block' : 'none';
            document.getElementById('tab-kafalah').style.display = tab === 'kafalah' ? 'block' : 'none';
            document.getElementById('btn-tab-kinerja').className = tab === 'kinerja' ? 'flex-1 px-4 py-3 tab-btn active rounded-lg text-sm font-bold transition flex justify-center items-center gap-2' : 'flex-1 px-4 py-3 tab-btn rounded-lg text-sm font-bold transition flex justify-center items-center gap-2';
            document.getElementById('btn-tab-kafalah').className = tab === 'kafalah' ? 'flex-1 px-4 py-3 tab-btn active rounded-lg text-sm font-bold transition flex justify-center items-center gap-2' : 'flex-1 px-4 py-3 tab-btn rounded-lg text-sm font-bold transition flex justify-center items-center gap-2';
        }

        function renderRincian() {
            const selectedVal = document.getElementById('filter-bulan').value;
            if(!selectedVal) return;
            
            const data = laporanDiterima.find(k => 
                (k.bulan_laporan || "").trim() === selectedVal || 
                (k.bulan_id_laporan || "").trim() === selectedVal
            );
            
            if(!data) {
                document.getElementById('rincian-container').innerHTML = `<div class="text-center p-10 bg-gray-50 rounded-xl text-gray-400 border border-dashed border-gray-300"><i class="fas fa-file-excel text-4xl mb-3 opacity-30"></i><p>Laporan berstatus <b>DITERIMA</b> belum tersedia untuk bulan ini.</p></div>`;
                return;
            }

            let containerHtml = `
            <!-- HEADER INFO: 4 KOLOM -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                <div class="p-5 border-b border-gray-100 bg-teal-50/30 grid grid-cols-1 md:grid-cols-4 gap-4 text-center divide-y md:divide-y-0 md:divide-x divide-gray-200">
                    <div class="md:px-4 py-2 md:py-0 flex flex-col justify-center items-center">
                        <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1">ID Laporan</p>
                        <p class="font-bold text-gray-800 text-sm">${data.id_laporan || data.bulan_id_laporan || '-'}</p>
                    </div>
                    <div class="md:px-4 py-2 md:py-0 flex flex-col justify-center items-center">
                        <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1">Waktu Kirim Laporan</p>
                        <p class="font-semibold text-gray-800 text-xs">${formatTanggalWITA(data.timestamp_laporan || data.timestamp)}</p>
                    </div>
                    <div class="md:px-4 py-2 md:py-0 flex flex-col justify-center items-center">
                        <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1">Waktu Verifikasi</p>
                        <p class="font-semibold text-gray-800 text-xs">${formatTanggalWITA(data.timestamp_verifikasi)}</p>
                    </div>
                    <div class="md:px-4 py-2 md:py-0 flex flex-col justify-center items-center">
                        <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider mb-1">Status Laporan</p>
                        <span class="px-3 py-1 bg-green-100 text-green-700 border border-green-200 rounded-full text-xs font-bold inline-flex items-center"><i class="fas fa-check-circle mr-1.5"></i> ${data.status}</span>
                    </div>
                </div>
            </div>

            <div class="flex gap-2 w-full mb-6">
                <button onclick="switchTabRincian('kinerja')" id="btn-tab-kinerja" class="flex-1 px-4 py-3 tab-btn active rounded-lg text-sm font-bold transition flex justify-center items-center gap-2"><i class="fas fa-tasks"></i> Kinerja Dai</button>
                <button onclick="switchTabRincian('kafalah')" id="btn-tab-kafalah" class="flex-1 px-4 py-3 tab-btn rounded-lg text-sm font-bold transition flex justify-center items-center gap-2"><i class="fas fa-wallet"></i> Rincian Kafalah</button>
            </div>

            <div id="tab-kinerja" class="space-y-6">${getHtmlKinerja(data)}</div>
            <div id="tab-kafalah" class="hidden space-y-6">${getHtmlKafalah(data)}</div>
            `;

            document.getElementById('rincian-container').innerHTML = containerHtml;
        }

        function getHtmlKinerja(d) {
            let colorLevel = 'text-gray-800';
            let lvl = (d.level || '').toLowerCase();
            if(lvl.includes('mumtaz')) colorLevel = 'text-green-600';
            else if(lvl.includes('jayyid')) colorLevel = 'text-blue-600';

            // KARYA UNGGULAN
            let karyaHtml = '';
            const listKarya = [
                { key: 'a1', title: 'Pengajar Al-Quran' },
                { key: 'a2', title: 'Murabbi / Pra Murabbi' },
                { key: 'a3', title: 'Pengurus / Pra Pengurus' },
                { key: 'a4', title: 'Camaba STIBA' },
                { key: 'a5', title: 'Camaba Sekolah Dai' } 
            ];
            listKarya.forEach(k => {
                let rincian = d[k.key + '_rincian'];
                if(rincian && rincian.trim() !== '' && rincian.trim() !== '-') {
                    karyaHtml += `<div class="mb-4 last:mb-0">
                        <p class="font-bold text-teal-700 text-sm mb-2"><i class="fas fa-check-circle text-teal-600 mr-1"></i> ${k.title}</p>
                        <div class="bg-gray-50 border border-gray-100 p-3 rounded-lg text-sm shadow-inner font-medium text-gray-700">
                            ${renderList(rincian)}
                        </div>
                    </div>`;
                } else {
                    karyaHtml += `<div class="mb-4 last:mb-0">
                        <p class="font-bold text-teal-700 text-sm mb-2 flex items-center"><i class="fas fa-times-circle text-red-500 mr-1"></i> ${k.title}</p>
                        <div class="bg-gray-50 border border-gray-100 p-3 rounded-lg text-sm shadow-inner text-gray-400 italic font-medium">
                            Tidak ada data rincian.
                        </div>
                    </div>`;
                }
            });

            return `
            <!-- Tata letak nilai kinerja CENTER Kiri-Kanan Atas-Bawah -->
            <div class="flex flex-row items-center justify-center p-8 bg-white border border-gray-200 rounded-xl shadow-sm mb-6 max-w-lg mx-auto divide-x divide-gray-300">
                <div class="flex-1 flex flex-col items-center justify-center px-4 py-2">
                    <p class="text-[10px] md:text-xs font-bold text-gray-500 uppercase tracking-widest mb-1 text-center">TOTAL NILAI KINERJA</p>
                    <p class="text-5xl md:text-6xl font-black text-[#1e293b] text-center">${d.nilai_kinerja || 0}</p>
                </div>
                <div class="flex-1 flex flex-col items-center justify-center px-4 py-2">
                    <p class="text-[10px] md:text-xs font-bold text-gray-500 uppercase tracking-widest mb-1 text-center">PREDIKAT LEVEL</p>
                    <p class="text-2xl md:text-3xl font-black ${colorLevel} uppercase tracking-wide text-center">${d.level || '-'}</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- DAKWAH KHUSUS (HALAQAH) DI ATAS -->
                <div class="border rounded-xl bg-white overflow-hidden shadow-sm md:col-span-2">
                    <div class="card-header-custom uppercase"><i class="fas fa-users text-blue-500"></i> DAKWAH KHUSUS</div>
                    <div class="p-4 text-sm divide-y divide-gray-100">
                        <div class="py-2.5 flex justify-between items-center">
                            <span class="text-gray-600 font-medium">Halaqah Tarbiyah</span> 
                            <span class="font-bold text-gray-800 text-right">${d.c1_halaqah||0} Kelompok / ${d.c1_peserta||0} Peserta / ${d.c1_aktif||0} Aktif</span>
                        </div>
                        <div class="py-2.5 flex justify-between items-center">
                            <span class="text-gray-600 font-medium">Halaqah Dirosa</span> 
                            <span class="font-bold text-gray-800 text-right">${d.c2_dirosa_halaqah||0} Kelompok / ${d.c2_dirosa_peserta||0} Peserta / ${d.c2_dirosa_aktif||0} Aktif</span>
                        </div>
                        <div class="py-2.5 flex justify-between items-center">
                            <span class="text-gray-600 font-medium">Halaqah Tahsin</span> 
                            <span class="font-bold text-gray-800 text-right">${d.c2_tahsin_halaqah||0} Kelompok / ${d.c2_tahsin_peserta||0} Peserta / ${d.c2_tahsin_aktif||0} Aktif</span>
                        </div>
                    </div>
                </div>

                <!-- DAKWAH UMUM & BERKANTOR -->
                <div class="border rounded-xl bg-white overflow-hidden shadow-sm">
                    <div class="card-header-custom uppercase"><i class="fas fa-bullhorn text-orange-500"></i> DAKWAH UMUM & BERKANTOR</div>
                    <div class="p-4 text-sm divide-y divide-gray-100">
                        <div class="py-2.5 flex justify-between items-center"><span class="text-gray-600 font-medium">Waktu Berkantor</span> <span class="font-bold text-gray-800 text-right">${d.waktu_berkantor_jam||0} Jam</span></div>
                        <div class="py-2.5 flex justify-between items-center"><span class="text-gray-600 font-medium">Khotbah Jumat</span> <span class="font-bold text-gray-800 text-right">${d.khotbah_jumat||0} Kali</span></div>
                        <div class="py-2.5 flex justify-between items-center"><span class="text-gray-600 font-medium">Taklim / Tablig Akbar</span> <span class="font-bold text-gray-800 text-right">${d.taklim_tablig||0} Kali</span></div>
                    </div>
                </div>

                <!-- SILATURAHMI & LAINNYA -->
                <div class="border rounded-xl bg-white overflow-hidden shadow-sm">
                    <div class="card-header-custom uppercase"><i class="fas fa-handshake text-green-500"></i> SILATURAHMI & LAINNYA</div>
                    <div class="p-4 text-sm divide-y divide-gray-100">
                        <div class="py-2.5 flex justify-between items-center"><span class="text-gray-600 font-medium">Silaturahmi Internal</span> <span class="font-bold text-gray-800 text-right">${d.silaturahmi_internal_jml||0} Kali</span></div>
                        <div class="py-2.5 flex justify-between items-center"><span class="text-gray-600 font-medium">Silaturahmi Eksternal</span> <span class="font-bold text-gray-800 text-right">${d.silaturahmi_eksternal_jml||0} Kali</span></div>
                        <div class="py-2.5 flex justify-between items-center"><span class="text-gray-600 font-medium">Alpa Tarbiyah</span> <span class="font-bold text-gray-800 text-right">${d.ketidakhadiran_tarbiyah||0} Kali</span></div>
                        <div class="py-2.5 flex justify-between items-center"><span class="text-gray-600 font-medium">Izin</span> <span class="font-bold text-gray-800 text-right">${d.izin||d.hari_izin||0} Hari</span></div>
                    </div>
                </div>

                <!-- KARYA UNGGULAN -->
                <div class="border rounded-xl bg-white overflow-hidden shadow-sm md:col-span-2">
                    <div class="card-header-custom uppercase"><i class="fas fa-star text-yellow-500"></i> KARYA UNGGULAN</div>
                    <div class="p-5">${karyaHtml}</div>
                </div>

            </div>`;
        }

        function getHtmlKafalah(d) {
            let isKhusus = (d.khusus && d.khusus.trim() !== '') || (d.batasan && d.batasan.trim() !== '');

            let html = `
            <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
                <div class="card-header-custom justify-center bg-teal-600 text-white border-none py-4"><i class="fas fa-file-invoice-dollar text-xl"></i> <span class="text-lg font-bold uppercase tracking-wider">RINCIAN KAFALAH</span></div>
                <table class="w-full text-sm text-gray-700">
                    <tbody class="divide-y divide-gray-100">`;

            if(!isKhusus) {
                // HIJAU - PENDAPATAN
                html += `
                        <tr class="bg-green-50 border-b border-green-100"><td colspan="2" class="px-4 py-3 font-bold text-xs text-green-700 uppercase"><i class="fas fa-plus-circle mr-1"></i> KOMPONEN PENDAPATAN</td></tr>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-4 pl-8 font-medium">Kafalah Pokok</td><td class="p-4 font-bold text-right text-gray-800">${formatRupiah(d.kafalah_pokok)}</td></tr>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-4 pl-8 font-medium">Kafalah Kinerja</td><td class="p-4 font-bold text-right text-gray-800">${formatRupiah(d.kafalah_kinerja)}</td></tr>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-4 pl-8 font-medium">Tunjangan Amanah</td><td class="p-4 font-bold text-right text-gray-800">${formatRupiah(d.tunjangan_amanah)}</td></tr>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-4 pl-8 font-medium">Tunjangan Wilayah</td><td class="p-4 font-bold text-right text-gray-800">${formatRupiah(d.tunjangan_wilayah)}</td></tr>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-4 pl-8 font-medium">Tunjangan Keluarga</td><td class="p-4 font-bold text-right text-gray-800">${formatRupiah(d.tunjangan_keluarga)}</td></tr>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-4 pl-8 font-medium">Bonus Karya Unggulan</td><td class="p-4 font-bold text-right text-gray-800">${formatRupiah(d.bonus_karya_unggulan)}</td></tr>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-4 pl-8 font-medium">Penambah Lainnya</td><td class="p-4 font-bold text-right text-gray-800">${formatRupiah(d.penambah)}</td></tr>
                `;
                // MERAH - POTONGAN
                html += `
                        <tr class="bg-red-50 border-b border-red-100"><td colspan="2" class="px-4 py-3 font-bold text-xs text-red-600 uppercase"><i class="fas fa-minus-circle mr-1"></i> KOMPONEN POTONGAN</td></tr>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-4 pl-8 font-medium">Izin</td><td class="p-4 font-bold text-right text-red-600">- ${formatRupiah(d.izin || d.hari_izin)}</td></tr>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-4 pl-8 font-medium">Pengurang Lainnya</td><td class="p-4 font-bold text-right text-red-600">- ${formatRupiah(d.pengurang)}</td></tr>
                `;
            } else {
                html += `<tr><td colspan="2" class="p-6 text-center text-gray-500 italic border-b bg-gray-50 font-medium"><i class="fas fa-info-circle text-gray-400 mr-1"></i> Rincian komponen disembunyikan karena terdapat kondisi khusus/batasan.</td></tr>`;
            }

            // BIRU - TOTAL & SUMBER DANA
            html += `
                        <tr class="bg-blue-50 border-t-2 border-blue-200">
                            <td class="p-5 font-bold text-blue-900 text-base md:text-lg uppercase">TOTAL KAFALAH</td>
                            <td class="p-5 font-bold text-right text-blue-700 text-xl md:text-2xl">${formatRupiah(d.total_kafalah)}</td>
                        </tr>
                        <tr class="bg-blue-50/50 border-t border-b border-blue-100"><td colspan="2" class="px-4 py-3 font-bold text-xs text-blue-700 uppercase tracking-wider"><i class="fas fa-hand-holding-usd mr-1"></i> SUMBER DANA KAFALAH</td></tr>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-4 pl-8 font-medium text-gray-700">Tanggungan DPW/DPD/Instansi Tempat Tugas</td><td class="p-4 font-bold text-right text-gray-800">${formatRupiah(d.dpw_dpd_instansi_tempat_tugas || d['dpw/dpd/instansi_tempat_tugas'])}</td></tr>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition"><td class="p-4 pl-8 font-medium text-gray-700">Tanggungan DPW/DPD Persaudaraan</td><td class="p-4 font-bold text-right text-gray-800">${formatRupiah(d.dpw_dpd_persaudaraan || d['dpw/dpd_persaudaraan'])}</td></tr>
                        <tr class="bg-blue-50/30 border-t border-blue-100"><td class="p-4 pl-8 font-bold text-blue-900">Tanggungan Lajnah Dai DPP</td><td class="p-4 font-bold text-right text-blue-900 text-lg">${formatRupiah(d.kafalah_lajnah_dai_dpp)}</td></tr>
                    </tbody>
                </table>
            </div>`;
            
            return html;
        }

        // ========================
        // GRAFIK (Chart.js)
        // ========================
        function bukaModalGrafik() {
            if(laporanDiterima.length === 0) {
                Swal.fire('Info', 'Belum ada data laporan diterima untuk ditampilkan.', 'info');
                return;
            }
            
            document.getElementById('modal-grafik').classList.remove('hidden');
            
            let sortedData = [];
            db.listBulan.forEach(bln => {
                let found = laporanDiterima.find(k => (k.bulan_laporan || "").trim() === bln || (k.bulan_id_laporan || "").trim() === bln);
                if(found) sortedData.push(found);
            });

            let labels = sortedData.map(d => (d.bulan_laporan || d.bulan_id_laporan).split(' ')[0]); 
            let dataKinerja = sortedData.map(d => parseFloat(d.nilai_kinerja || 0));
            let dataKafalah = sortedData.map(d => num(d.total_kafalah));

            // Chart Kinerja - Line dengan Gradien Modern
            const ctxKin = document.getElementById('chartKinerja').getContext('2d');
            if(chartInstanceKinerja) chartInstanceKinerja.destroy();
            let gradientKin = ctxKin.createLinearGradient(0, 0, 0, 400);
            gradientKin.addColorStop(0, 'rgba(16, 185, 129, 0.5)'); // Teal semi-transparent
            gradientKin.addColorStop(1, 'rgba(16, 185, 129, 0.0)');
            
            chartInstanceKinerja = new Chart(ctxKin, {
                type: 'line',
                data: { labels: labels, datasets: [{ label: 'Skor Kinerja', data: dataKinerja, borderColor: '#10b981', backgroundColor: gradientKin, borderWidth: 3, tension: 0.4, fill: true, pointBackgroundColor: '#fff', pointBorderColor: '#047857', pointBorderWidth: 2, pointRadius: 5, pointHoverRadius: 7 }] },
                options: { responsive: true, plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, titleFont: { size: 13, family: 'Inter' }, bodyFont: { size: 14, weight: 'bold', family: 'Inter' } } }, scales: { y: { beginAtZero: true, max: 100, grid: { borderDash: [5, 5], color: '#e2e8f0' } }, x: { grid: { display: false } } } }
            });

            // Chart Kafalah - Bar Modern
            const ctxKaf = document.getElementById('chartKafalah').getContext('2d');
            if(chartInstanceKafalah) chartInstanceKafalah.destroy();
            let gradientKaf = ctxKaf.createLinearGradient(0, 0, 0, 400);
            gradientKaf.addColorStop(0, 'rgba(59, 130, 246, 0.8)'); // Blue solid
            gradientKaf.addColorStop(1, 'rgba(59, 130, 246, 0.5)'); // Blue fade
            
            chartInstanceKafalah = new Chart(ctxKaf, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Total Kafalah', data: dataKafalah, backgroundColor: gradientKaf, borderRadius: 6, barThickness: 'flex', maxBarThickness: 45 }] },
                options: { responsive: true, plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, titleFont: { size: 13, family: 'Inter' }, bodyFont: { size: 14, weight: 'bold', family: 'Inter' }, callbacks: { label: function(context) { return formatRupiah(context.raw); } } } }, scales: { y: { beginAtZero: true, grid: { borderDash: [5, 5], color: '#e2e8f0' }, ticks: { callback: function(value) { return 'Rp ' + (value/1000) + 'k'; } } }, x: { grid: { display: false } } } }
            });
        }

        function tutupModalGrafik() {
            document.getElementById('modal-grafik').classList.add('hidden');
        }
    </script>
</body>
</html>
